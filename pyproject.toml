[project]
name = "ringtwice"
description = "CLI tool to process emails with LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Adam Twardoch", email = "adam+github@twardoch.com" }]
keywords = ["email", "llm", "gmail", "imap", "cli", "ai", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    # CLI
    "fire>=0.6.0",
    # Config & utilities
    "platformdirs>=4.0.0",
    "pathvalidate>=3.2.0",
    "python-slugify>=8.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    # Email access
    "imap-tools>=1.8.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    # Email processing
    "html2text>=2024.2.26",
    "mail-parser-reply>=1.36",
    # LLM
    "openai>=1.40.0",
    # Text splitting
    "semantic-text-splitter>=0.18.0",
    "tiktoken>=0.7.0",
    # Data validation
    "pydantic>=2.5.0",
    # CLI output
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=3.15.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]
docs = [
    "zensical>=0.0.11",
]
all = ["ringtwice[dev,docs]"]

[project.scripts]
ringtwice = "ringtwice.cli:main"

[project.urls]
Homepage = "https://github.com/twardoch/ringtwice"
Documentation = "https://twardoch.github.io/ringtwice"
Repository = "https://github.com/twardoch/ringtwice"
Issues = "https://github.com/twardoch/ringtwice/issues"
Changelog = "https://github.com/twardoch/ringtwice/releases"

# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.*)"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/ringtwice/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/ringtwice"]

# =============================================================================
# Hatch Environments
# =============================================================================

[tool.hatch.envs.default]
installer = "uv"
dependencies = ["ringtwice[dev]"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=src/ringtwice --cov-report=term-missing --cov-report=xml {args:tests}"
lint = "ruff check {args:src tests}"
fmt = "ruff format {args:src tests}"
fix = "ruff check --fix {args:src tests}"
typecheck = "mypy src/ringtwice"
all = ["fix", "fmt", "lint", "typecheck", "test"]

[tool.hatch.envs.docs]
installer = "uv"
dependencies = ["ringtwice[docs]"]

[tool.hatch.envs.docs.scripts]
build = "zensical build"
serve = "zensical serve"

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
exclude = ["src/ringtwice/_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "PL",  # Pylint
]
ignore = [
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches (complex async pipeline code)
    "PLR0915", # Too many statements (complex async pipeline code)
    "PLR2004", # Magic value comparison
    "PLC0415", # Import not at top-level (intentional lazy imports)
    "SIM105",  # contextlib.suppress preference
]

[tool.ruff.lint.isort]
known-first-party = ["ringtwice"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# =============================================================================
# Mypy Configuration
# =============================================================================

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "fire.*",
    "imap_tools.*",
    "mailparser_reply.*",
    "html2text.*",
    "slugify.*",
    "pathvalidate.*",
    "semantic_text_splitter.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.oauth2.*",
    "google.auth.transport.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error", "ignore::DeprecationWarning:mailparser_reply.*"]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
branch = true
source = ["src/ringtwice"]
omit = ["src/ringtwice/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 80
show_missing = true
